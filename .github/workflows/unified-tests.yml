name: Unified Tests (Fly Runner)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read
  actions: read

jobs:
  start-runner:
    name: Start Fly Runner
    # Enable only after configuring the required Fly/AWS secrets and targets.
    if: vars.FLY_UNIFIED_TESTS_ENABLED == 'true'
    uses: ./.github/workflows/start-fly-runner.yml
    secrets: inherit

  unified-tests:
    name: Run Unified Tests
    runs-on: ${{ fromJSON(format('[{0}]', needs.start-runner.outputs.runner-labels)) }}
    needs: start-runner
    if: needs.start-runner.outputs.runner-ready == 'true'
    timeout-minutes: 90
    environment: unified-tests
    permissions:
      id-token: write  # Required for OIDC authentication with AWS
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      TEST_DISCORD_WEBHOOK_URL: ${{ secrets.TEST_DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::444554165670:role/GitHubActionsS3Role
          aws-region: us-east-1
          role-duration-seconds: 43200 # 12 hours

      - name: Fetch secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            ,testing/unified/tests
          parse-json-secrets: true

      - name: Verify Docker is available
        run: docker info

      - name: Verify uv and Python
        run: |
          uv --version
          python3.12 --version
          which python3.12

      - name: Install the project
        run: uv sync --all-extras

      - name: Run unified tests
        run: uv run python -m tests.unified.run

  cleanup-machine:
    name: Cleanup Fly Machine and Runner
    runs-on: ubuntu-latest
    needs: [start-runner, unified-tests]
    if: always() && needs.start-runner.outputs.machine-id != ''
    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node.js 24 commit

      - name: Cleanup fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TESTING }}
          FLY_RUNNER_APP: ivysaur
          MACHINE_ID: ${{ needs.start-runner.outputs.machine-id }}
        run: |
          set -euo pipefail
          if [ -z "$MACHINE_ID" ]; then
            echo "No machine ID provided, skipping Fly cleanup."
            exit 0
          fi

          echo "Cleaning up machine: $MACHINE_ID"
          if ! flyctl machines stop "$MACHINE_ID" -a "$FLY_RUNNER_APP" \
              && ! flyctl machines status "$MACHINE_ID" -a "$FLY_RUNNER_APP" >/dev/null 2>&1; then
            echo "::error::Failed to stop machine ${MACHINE_ID} and it still exists"
            exit 1
          fi
          if ! flyctl machines destroy "$MACHINE_ID" -a "$FLY_RUNNER_APP" --force \
              && ! flyctl machines status "$MACHINE_ID" -a "$FLY_RUNNER_APP" >/dev/null 2>&1; then
            echo "::error::Failed to destroy machine ${MACHINE_ID} and it still exists"
            exit 1
          fi

      - name: Cleanup GitHub runner
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_ACTIONS }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ needs.start-runner.outputs.runner-name }}
        run: |
          set -euo pipefail
          echo "Cleaning up GitHub runner (name: ${RUNNER_NAME:-unknown})"

          HEADER_FILE=$(mktemp)
          chmod 0600 "$HEADER_FILE"
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GITHUB_TOKEN" >"$HEADER_FILE"
          trap 'rm -f "$HEADER_FILE"' EXIT

          RUNNERS_RESPONSE=$(curl -s --fail --header @"$HEADER_FILE" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners")

          if echo "$RUNNERS_RESPONSE" | grep -q '"message"'; then
            echo "::error::Failed to fetch runners: $(echo "$RUNNERS_RESPONSE" | jq -r '.message')"
            exit 1
          fi

          # Match the exact runner name for this run; no bare-label fallback.
          RUNNER_ID=$(echo "$RUNNERS_RESPONSE" | jq -r --arg name "$RUNNER_NAME" '.runners[]? | select(.name == $name) | .id' | head -n 1)

          if [ -z "$RUNNER_ID" ] || [ "$RUNNER_ID" = "null" ]; then
            echo "Runner not found, nothing to delete."
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            --header @"$HEADER_FILE" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/$RUNNER_ID")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "Successfully deleted runner."
          else
            echo "::error::Failed to delete runner ${RUNNER_NAME} (id ${RUNNER_ID}). HTTP code: $HTTP_CODE"
            exit 1
          fi
