# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy (Production Environment)
permissions:
  contents: read
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (without v prefix)"
        required: true
        type: string
        default: 'manual'

jobs:
  deploy-honcho-prod-image:
    name: Deploy Honcho Image (Production Environment)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-group
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node.js 24 commit
      - run: |
          # Determine the image label based on trigger type
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            IMAGE_LABEL="deployment-${INPUT_VERSION}"
          else
            IMAGE_LABEL="deployment-${GITHUB_REF_NAME}"
          fi
          flyctl deploy -a honcho-prod-image --remote-only --build-only --push --no-cache --image-label "$IMAGE_LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}

  prompt-service:
    name: Push to Service (Production Environment)
    needs: deploy-honcho-prod-image
    runs-on: ubuntu-latest
    steps:
      - name: Encode webhook JSON
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Determine version and image label based on trigger type
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_VERSION"
            IMAGE_LABEL="honcho-prod-image:deployment-${INPUT_VERSION}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            IMAGE_LABEL="honcho-prod-image:deployment-${GITHUB_REF_NAME}"
          fi
          TAG="$TAG" IMAGE_LABEL="$IMAGE_LABEL" python3 -c 'import json, os; open("payload.json", "w").write(json.dumps({"version": os.environ["TAG"], "image_label": os.environ["IMAGE_LABEL"]}))'

      - name: Send POST request
        env:
          WEBHOOK_SECRET: ${{ secrets.PROD_ENV_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.PROD_ENV_URL }}
        run: |
          curl --fail -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            --json-file payload.json \
            "$WEBHOOK_URL/webhooks/v1/add_honcho_version"
