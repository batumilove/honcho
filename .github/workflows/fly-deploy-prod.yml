# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy (Production Environment)
permissions:
  contents: read
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (without v prefix)"
        required: true
        type: string
        default: 'manual'

jobs:
  deploy-honcho-prod-image:
    name: Deploy Honcho Image (Production Environment)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-group
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node.js 24 commit
      - run: |
          # Determine the image label based on trigger type
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            IMAGE_LABEL="deployment-${INPUT_VERSION}"
          else
            IMAGE_LABEL="deployment-${GITHUB_REF_NAME}"
          fi
          flyctl deploy -a honcho-prod-image --remote-only --build-only --push --no-cache --image-label "$IMAGE_LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}

  prompt-service:
    name: Push to Service (Production Environment)
    needs: deploy-honcho-prod-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Encode webhook JSON
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          IMAGE_LABEL_PREFIX: "honcho-prod-image:deployment-"
          WEBHOOK_SECRET: ${{ secrets.PROD_ENV_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.PROD_ENV_URL }}
        run: |
          python3 .github/scripts/fly_webhook_payload.py
          chmod 600 payload.json curl-config
      - name: Send POST request
        run: |
          # Secrets live in the mode-600 curl config file, never in argv.
          curl --fail --silent --show-error -K curl-config --data-binary @payload.json -o /dev/null -w '%{http_code}'
